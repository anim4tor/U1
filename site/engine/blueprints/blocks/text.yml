name: field.blocks.text.name
icon: text
wysiwyg: true
preview: text
tabs:
  text:
    fields:
      text:
        label: field.blocks.heading.text
        type: writer
        inline: true
        placeholder: field.blocks.text.placeholder

      face:
        label: Override font
        empty: true
        type: select
        width: 1/2
        options:
          - value: heading
            text: Heading
          - value: body
            text: Body
          - value: button
            text: Button        

      case:
        label: Override case
        type: select
        empty: true
        width: 1/2
        options:
          - value: upper
            text: Uppercase
          - value: lower
            text: Lowercase

  interactions: settings/interactions/animation
  node: settings/node

