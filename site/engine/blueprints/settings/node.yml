name: Node
type: group
icon: code
fields:
  bid:
    type: text
    label: Id
    grow: false
    width: 1/3
  
  attr:
    type: text
    width: 2/3

  css:
    type: text
    width: 1/1

  href:
    label: Url
    type: link
    width: 2/3

  target:
    label: Target
    type: toggle
    text: New window?
    width: 1/3

  node:
    type: select
    width: 1/1
    options:
      - div
      - span
      - section
      - header
      - footer
      - main
      - aside
      - nav
      - article
      - figure
      - address