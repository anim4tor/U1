name: Image animations
type: group
icon: code
fields:
  hasParallax:
    label: Parallax image
    type: toggle
    default: false
    width: 1/4

  parallax:
    when:
      hasParallax: true
    label: Parallax strenght
    help: Relative to native page scrolling
    type: range
    min: 0
    max: 10
    step: 1
    default: 0
    placeholder: 0
    width: 3/4

  hasReveal:
    label: Reveal image?
    type: toggle
    default: false
    width: 1/4

  reveal:
    when:
      hasReveal: true
    label: Reveal from
    type: toggles
    labels: false
    width: 3/4
    options:
      - value: top
        text: top
        icon: arrow-down
      - value: left
        text: left
        icon: arrow-right
      - value: bottom
        text: bottom
        icon: arrow-up
      - value: right
        text: right
        icon: arrow-left