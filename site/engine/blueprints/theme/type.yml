label: Typography
columns:
  - width: 1/1
    fields:
      typeL:
        type: line
      typeH:
        type: headline
        label: Typografie

  - width: 3/4
    fields:

      bodyFace:
        type: select
        label: Body font
        width: 1/2
        options:
          type: query
          # query: kirby.option('gi.colors')
          query: page('theme').fontFaces.toStructure
          text: "{{ item.family }}"
          value: "{{ item.family }}"

      headingFace:
        type: select
        label: Heading font
        width: 1/2
        options:
          type: query
          # query: kirby.option('gi.colors')
          query: page('theme').fontFaces.toStructure
          text: "{{ item.family }}"
          value: "{{ item.family }}"

      scriptFace:
        type: select
        label: Script font
        width: 1/2
        options:
          type: query
          # query: kirby.option('gi.colors')
          query: page('theme').fontFaces.toStructure
          text: "{{ item.family }}"
          value: "{{ item.family }}"

      # typeScaleDefault:
      #   label: Default scale
      #   width: 2/3
      #   type: range
      #   default: 1.618
      #   placeholder: 1.618
      #   min: 1
      #   max: 2
      #   step: 0.01
  - width: 1/4
    fields:
      typeSetup:
        label: Customize type
        help: Customize site typography
        type: toggle

  - width: 1/1
    fields:
      typeCustom:
        type: group
        when:
          typeSetup: true
        fields:
          typeL2:
            type: line
          typeScaleBody:
            label: Body scale
            width: 1/2
            type: range
            default: 1.125
            placeholder: 1.125
            min: 1
            max: 2
            step: 0.01

          typeScaleHeading:
            label: Heading scale
            width: 1/2
            type: range
            default: 1.618
            placeholder: 1.618
            min: 1
            max: 2
            step: 0.01

          typeBaseMin: 
            width: 1/4
            label: Body base
            type: number
            default: 16
            placeholder: 16
            min: 0
            max: 30
            after: px

          typeBodyMin: 
            width: 1/4
            label: Body min
            help: Body type minimal size
            type: number
            default: 0.8
            placeholder: 0.8
            min: 0.5
            max: 5
            step: 0.1
            after: rem

          typeBaseFlexible: 
            width: 1/4
            label: Flexible base
            type: number
            default: 1.0
            placeholder: 1.0
            min: 0.5
            max: 3
            step: 0.1
            after: vw

          typeHeadingMin: 
            width: 1/4
            label: Flexible min
            help: Heading type minimal size
            type: number
            default: 1.2
            placeholder: 1.2
            min: 0.5
            max: 5
            step: 0.1
            after: rem


          typescale:
            type: structure
            label: Type scale
            help: Overrides auto scaling
            fields:
              html:
                type: toggles
                options:
                  - Body
                  - Heading
                  - Button
                  - Script
              headingLevel: 
                when:
                  html: Heading
                label: Level
                type: number
                min: 1
                max: 6
                before: H
              bodyLevel:
                when: 
                  html: Body
                label: Level
                type: toggles
                options:
                  - value: lg
                    text: Large
                  - value: md
                    text: Medium
                  - value: default
                    text: Default
                  - value: sm
                    text: Small
                  - value: xs
                    text: Tiny
              typeface:
                type: select
                label: Typeface
                options:
                  type: query
                  # query: kirby.option('gi.colors')
                  query: site.fontFaces.toStructure
                  text: "{{ item.family }}"
                  value: "{{ item.family }}"
              unit:
                label: Size unit
                width: 2/3
                type: toggles
                default: scale
                options:
                  - scale
                  - custom
              size:
                when:
                  unit: custom
                width: 1/3
                label: Size
                type: number
                min: 0.1
                max: 20
                step: 0.1

              weight:
                label: Weight
                type: select
                width: 1/2
                options:
                  - light
                  - regular
                  - medium
                  - bold
              case:
                label: Case
                type: select
                default: normal
                width: 1/2
                options:
                  - normal
                  - uppercase
                  - capitalize
                  - lowercase

          
          

          fontFaces:
            label: Fontfaces
            type: structure
            wysiwyg: true
            help: Declare fontfaces from assets folder or import from Google/Adobe fonts

            fields:
              family:
                type: text
                width: 2/3
              class:
                type: select
                width: 1/3
                options:
                  - Sans Serif
                  - Serif
                  - Slab Serif
                  - Script
                  - Mono
                  - Hand
              source:
                type: toggles
                options:
                  - Local
                  - Import
              src:
                when:
                  source: Local
                type: text
                after: ".woff"

              url:
                when:
                  source: Import
                type: text
                before: "@import"

              weight:
                type: multiselect
                width: 1/2
                options:
                  - 100
                  - 200
                  - 300
                  - 400
                  - 500
                  - 600
                  - 700
                  - 800
                  - 900

              style:
                type: multiselect
                width: 1/2
                options:
                  - normal
                  - italic


