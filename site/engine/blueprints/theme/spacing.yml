label: Spacing
columns:
  - width: 1/1
    fields:
      scalingH:
        type: headline
        label: Spacing

  - width: 3/4
    fields:  
      scale:
        label: Scale spacing
        help: Adjusts site spacing scale
        type: range
        default: 1
        min: 0
        max: 2
        step: 0.1

  - width: 1/4
    fields:
      scaleSetup:
        width: 1/3
        label: Customize spacing
        help: Customize site spacing details
        type: toggle

  - width: 1/1
    fields:
      scaleCustom:
        type: group
        when:
          scaleSetup: true
        fields:
          scaleL:
            type: line
          min:
            width: 1/2
            label: Minimal unit
            type: number
            default: 1
            min: 0.1
            max: 2
            step: 0.1
            after: rem

          base:
            width: 1/2
            label: Flexible unit
            type: number
            default: 2.0
            placeholder: 2.0
            min: 0.5
            max: 3
            step: 0.1
            after: vw

          vpad:
            width: 1/2
            label: Vertical spacing
            help: Adjusts site vertical spacing
            type: range
            min: 0
            max: 1
            step: 0.1

          hpad:
            width: 1/2
            label: Horizonatal spacing
            help: Adjusts site horizontal spacing
            type: range
            min: 0
            max: 1
            step: 0.1

          gap:
            width: 1/2
            label: Gap spacing
            help: Adjusts site gaps spacing
            type: range
            min: 0
            max: 1
            step: 0.1