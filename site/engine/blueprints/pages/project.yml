title: Lecture

status:
  draft: true
  unlisted: true
  listed: true

tabs:
  content:
    columns:
      - width: 1/1

        fields:
          hero:
            extends: fields/hero
          cover:
            extends: fields/cover
          intro:
            type: writer
          details:
            extends: fields/section
            label: Details
          before:
            extends: fields/cover
            width: 1/2
          after:
            extends: fields/cover
            width: 1/2
          quote:
            extends: fields/section
            label: Quote
  info:
    columns:
      - width: 2/3
        fields:
          mainHeadline:
            type: headline
            label: Základní informace
          client:
            width: 1/2
            label: Klient
            type: text
          date:
            width: 1/2
            type: date
            label: Rok realizace
          place:
            width: 1/2
            type: text
            label: Lokalita
          size:
            width: 1/2
            type: text
            label: Velikost

          teamHeadline:
            type: headline
            label: Realizace a autoři
          team:
            width: 1/1
            type: multiselect
            label: Tým U1
            options:
              type: query
              query: site.index.filterBy("intendedTemplate", "in", ["employee"])
              text: "{{ page.title }}"
              value: "{{ page.title }}"
          photo:
            width: 1/1
            label: Autor fotografií
            type: text

          customHeadline:
            type: headline
            label: Doplňující specifikace
          customInfo:
            label: Variabilní položky
            help: "Zadejte další informace o projektu (např. Koncept, Spolupráce / Collab, Vybavení / Furnishing apod.)"
            type: structure
            columns:
              label:
                width: 1/3
              value:
                width: 2/3
            fields:
              label:
                label: Položka
                type: text
                width: 1/3
                placeholder: "např. Spolupráce, Koncept, Vybavení..."
              value:
                label: Hodnota
                type: text
                width: 2/3
                placeholder: "např. Název studia, partnera, popis..."

      - width: 1/3
        fields:
          taxonomyHeadline:
            type: headline
            label: Kategorie a filtry
          space:
            type: tags
            label: Typ prostoru
          industry:
            type: tags
            label: Obor podnikání
          solutions:
            type: multiselect
            label: Služby
            options:
              type: query
              query: site.index.filterBy("intendedTemplate", "in", ["solution"])
              text: "{{ page.title }}"
          production:
            type: tags
            label: Výroba
          hash:
            type: tags
            label: Hashtagy

  gallery:
    columns:
      - width: 2/3
        fields:
          gallery:
            width: 1/1
            type: files
            template: cover
            info: "{{ file.dimensions }}"
            uploads:
              template: cover
            image:
              ratio: 5/4
              cover: true
            layout: cards
            size: large
            empty: No images yet
      - width: 1/3
        fields:
          

  testimonial:
    columns:
      - width: 2/3
        fields:
          testimonialQuote:
            type: writer
            label: Quote

      - width: 1/3
        fields:
          
          testimonialAuthor:
            type: text
            label: Author
          testimonialPosition:
            type: text
            label: Position
          testimonialImage:
            type: files
            label: Image/Logo
            template: logo
            info: "{{ file.dimensions }}"
            uploads:
              template: logo
            image:
              ratio: 4/5
              cover: true
            max: 1
            layout: cards
            size: small
  
  extras:
    columns:
      - width: 2/3
        fields:
          extras:
            extends: fields/section

      - width: 1/3
        fields:
          password:
            type: text

  meta: tabs/meta/page