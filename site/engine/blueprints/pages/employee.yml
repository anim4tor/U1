title: Employee
icon: 👩‍💼

status:
  draft: To be hired
  unlisted: Past
  listed: Active

columns:
  main:
    width: 2/3
    fields:
      team:
        type: select
        options:
          type: query
          query: kirby.collection("team")
          text: "{{ item.name }}"
          value: "{{ item.name }}"
      role:
        type: text
      bio:
        label: Bio
        type: writer
      
  sidebar:
    width: 1/3
    fields:
      photo:
        type: files
        headline: Profile image
        template: image
        info: "{{ file.dimensions }}"
        uploads:
          template: image
        image:
          ratio: 4/5
          cover: true
        min: 1
        layout: cards
        size: full
