title: Lectures

tabs:
  portfolio:
    columns:
      - width: 2/3
        sections:
          listed:
            extends: sections/projects
            headline: Featured lectures
            status: listed

      - width: 1/3
        sections:
          drafts:
            extends: sections/projects
            headline: Drafts
            layout: list
            status: draft
          unlisted:
            extends: sections/projects
            headline: Archive
            layout: list
            status: unlisted

  content:
    columns:
      - width: 3/4
        fields:
          hero:
            extends: fields/hero
            
      - width: 1/4
        sticky: true
        fields:
          order:
            type: structure 
            fields:
              label:
                label: Choose Section Layout
                type: select
                options: query
                query:
                  fetch: page.getCurrentAndGlobalSnippets
                  text: "{{ item.text }}"
                  value: "{{ item.value }}"                

  meta: tabs/meta/page