title: Instructor
icon: 👩‍💼

status:
  draft: To be hired
  unlisted: Past
  listed: Active

columns:
  main:
    width: 2/3
    fields:
      lectures:
        type: multiselect
        options:
          type: query
          query: kirby.collection("lectures")
          text: "{{ item.title }}"
          value: "{{ item.title }}"
      bio:
        label: Bio
        type: writer

  sidebar:
    width: 1/3
    fields:
      # slug:
      #   type: slug
      #   sync: title
      photo:
        type: files
        headline: Profile image
        template: image
        info: "{{ file.dimensions }}"
        uploads:
          template: image
        image:
          ratio: 4/5
          cover: true
        min: 1
        layout: cards
        size: full
