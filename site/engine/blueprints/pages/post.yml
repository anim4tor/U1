title: Post

status:
  draft: true
  unlisted: true
  listed: true

tabs:
  content:
    columns:
      - width: 2/3

        fields:
          cover:
            extends: fields/cover
          excerpt:
            type: writer
          details:
            type: blocks
          footnote:
            type: writer
          

      - width: 1/3
        fields:
          date:
            type: date
            label: Datum
          author:
            type: text
            label: Autor
          category:
            type: tags
            label: Kategorie
          solutions:
            type: multiselect
            label: Služby
            options:
              type: query
              query: site.index.filterBy("intendedTemplate", "in", ["solution"])
              text: "{{ page.title }}"

  projects:
    label: Related projects
    fields:
      related:
        type: pages
        query: site.find('projects')
    

  meta: tabs/meta/page