title: Post

status:
  draft: true
  unlisted: true
  listed: true

tabs:
  content:
    columns:
      - width: 2/3
        fields:
          cover:
            extends: fields/cover
          excerpt:
            label: Perex článku
            type: writer
          details:
            label: Obsah článku (bloky)
            type: blocks
          footnote:
            label: Poznámka pod čarou / Zdroje
            type: writer

          faqHeadline:
            label: Nadpis Časté otázky (volitelné)
            type: text
            placeholder: "Časté otázky"
          faq:
            label: Časté otázky k tématu článku
            type: structure
            fields:
              question:
                label: Otázka
                type: text
              answer:
                label: Odpověď
                type: textarea
          faqNote:
            label: Citace zdrojů pod otázkami
            type: text
            placeholder: "např. Zdroje: nařízení vlády č. 361/2007 Sb., JLL, Direct pojišťovna"

      - width: 1/3
        fields:
          date:
            type: date
            label: Datum vydání
          readTime:
            type: text
            label: Doba čtení
            placeholder: "např. 5 min čtení"
          author:
            type: text
            label: Autor
          category:
            type: tags
            label: Kategorie
          solutions:
            type: multiselect
            label: Související služby
            options:
              type: query
              query: site.index.filterBy("intendedTemplate", "in", ["solution"])
              text: "{{ page.title }}"

  projects:
    label: Související realizace
    fields:
      related:
        type: pages
        query: site.find('projects')

  cta: tabs/cta-subpage
  meta: tabs/meta/page
