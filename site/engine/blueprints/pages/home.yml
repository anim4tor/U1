title: Home

tabs:
  content:
    columns:
      - width: 3/4
        fields:
          hero:
            extends: fields/hero
            width: 1/2
          heroSlider:
            label: Hero Projects
            type: pages
            query: site.find('projects')
            width: 1/2

          about:
            width: 1/1
            extends: fields/section
            label: About
          aboutFigures:
            width: 1/1
            type: structure
            fields:
              feature:
                label: Number
                type: text
              label:
                label: Label
                type: text
          
          projects:
            width: 1/1
            extends: fields/section
            label: Projects
          featuredProjects:
            width: 1/2
            label: Featured Projects
            type: pages
            query: site.find('projects')
          featuredTestimonials:
            width: 1/2
            label: Featured Testimonials
            type: pages
            query: site.find('projects')

          services:
            width: 1/1
            extends: fields/section
            label: Services

          teams:
            width: 1/1
            extends: fields/section
            label: Teams

      - width: 1/4
        sticky: true
        fields:
          order:
            type: structure 
            wysiwyg: true
            fields:
              label:
                label: Choose Section Layout
                type: select
                options: query
                query:
                  fetch: page.getCurrentAndGlobalSnippets
                  text: "{{ item.text }}"
                  value: "{{ item.value }}"
    

  meta: tabs/meta/page