title: Home

tabs:
  content:
    fields:
      customTitle:
        label: Custom title
        width: 1/2
        type: writer
        inline: true
      subtitle:
        width: 1/2
        type: structure
        label: Subtitle slider
        fields:
          text:
            type: text
      menuTitle:
        label: Menu label
        width: 1/2
        type: text
      gradientFrom:
        width: 1/4
        label: Gradient From
        type: color
        mode: options
        options:
          type: query
          query: kirby.option('colors')
      gradientTo:
        width: 1/4
        label: Gradient To
        type: color
        mode: options
        options:
          type: query
          query: kirby.option('colors')
      cover:
        width: 1/1
        type: files
        template: cover
        info: "{{ file.dimensions }}"
        uploads:
          template: cover
        image:
          ratio: 5/4
          cover: true
        max: 1
        layout: cards
        size: full

      introFigure:
        extends: fields/image
        width: 1/2
        size: cover
        max: 1
      intro:
        width: 1/2
        extends: fields/header
        label: Intro
      events:
        width: 1/2
        extends: fields/header
        label: Events
      eventsFigure:
        extends: fields/image
        width: 1/2
        max: 2
      lectures:
        width: 1/1
        extends: fields/header
        label: Lectures

  meta: tabs/meta/page