title: About 

tabs:

  people:
    columns:
            
      - width: 2/3
        sections:
          listed:
            extends: sections/employees
            headline: Employees
            status: listed

      - width: 1/3
        sections:
          drafts:
            extends: sections/employees
            headline: To be hired
            layout: list
            status: draft
          unlisted:
            extends: sections/employees
            headline: Inactive
            layout: list
            status: unlisted

  content:
    columns:
      - width: 3/4
        fields:
          hero:
            extends: fields/hero
          featuredTestimonials:
            width: 1/1
            label: Featured Testimonials
            type: pages
            layout: list
            query: site.find('projects')
            image:
              cover: true

          about:
            extends: fields/header
            label: About

          storyHeading:
            label: Nadpis sekce Příběh
            type: text
            default: Příběh
          storyText:
            label: Text sekce Příběh
            type: textarea
          storyPhoto:
            label: Fotografie k příběhu
            type: files
            max: 1
          storyMilestones:
            label: Klíčové milníky / údaje
            type: structure
            fields:
              number:
                label: Číslo / Hodnota
                type: text
                width: 1/3
              label:
                label: Popis
                type: text
                width: 2/3

          valuesHeading:
            label: Nadpis hodnot (Na čem stavíme)
            type: text
            default: Na čem stavíme
          values:
            type: structure
            label: Values
            fields:
              step:
                type: number
              value:
                type: text
              figure:
                type: files
                template: image
                info: "{{ file.dimensions }}"
                uploads:
                  template: image
                image:
                  ratio: 5/4
                  cover: true
              detail:
                type: writer

          teamsHeader:
            extends: fields/section
          teams:
            type: structure
            fields:
              name:
                type: text
              details: 
                type: writer
              figure:
                type: files
                template: image
                info: "{{ file.dimensions }}"
                uploads:
                  template: image
                image:
                  ratio: 5/4
                  cover: true
              leader:
                type: pages
                query: site.find('about')

          peopleHeader:
            extends: fields/section
          # people:
          #   label: People
          #   type: pages
          #   query: site.find('about')
          #   # width: 1/2

          awardsHeading:
            label: Nadpis ocenění
            type: text
            default: Ocenění a nominace
          awards:
            label: Ocenění a nominace
            type: structure
            fields:
              year:
                label: Rok
                type: text
                width: 1/4
              title:
                label: Soutěž / Ocenění
                type: text
                width: 2/4
              detail:
                label: Detail / Projekt
                type: text
                width: 1/4

          career:
            extends: fields/section
            label: Careers

      - width: 1/4
        sticky: true
        fields:
          order:
            type: structure 
            wysiwyg: true
            fields:
              label:
                label: Choose Section Layout
                type: select
                options: query
                query:
                  fetch: page.getCurrentAndGlobalSnippets
                  text: "{{ item.text }}"
                  value: "{{ item.value }}"

  clients: tabs/clients
  cta: tabs/cta
  meta: tabs/meta/page