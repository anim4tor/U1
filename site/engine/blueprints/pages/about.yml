title: About 

tabs:

  people:
    columns:
            
      - width: 2/3
        sections:
          listed:
            extends: sections/employees
            headline: Employees
            status: listed

      - width: 1/3
        sections:
          drafts:
            extends: sections/employees
            headline: To be hired
            layout: list
            status: draft
          unlisted:
            extends: sections/employees
            headline: Inactive
            layout: list
            status: unlisted
  teams:
    columns:     
      - width: 1/1
        fields:
          teams:
            type: structure
            fields:
              name:
                type: text
              details: 
                type: writer
              figure:
                type: files
                template: image
                info: "{{ file.dimensions }}"
                uploads:
                  template: image
                image:
                  ratio: 5/4
                  cover: true
              leader:
                type: pages

  content:
    columns:
      - width: 1/1
        fields:
          cover:
            width: 1/1
            type: files
            template: cover
            info: "{{ file.dimensions }}"
            uploads:
              template: cover
            image:
              ratio: 5/4
              cover: true
            max: 1
            layout: cards
            size: full
          intro:
            type: writer
            inline: true

          about:
            extends: fields/header

  values:
    fields:
      values:
        type: structure
        fields:
          step:
            type: number
          value:
            type: text
          figure:
            type: files
            template: image
            info: "{{ file.dimensions }}"
            uploads:
              template: image
            image:
              ratio: 5/4
              cover: true
          detail:
            type: writer

  meta: tabs/meta/page