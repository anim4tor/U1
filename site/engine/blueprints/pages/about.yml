title: About 

tabs:

  people:
    columns:
            
      - width: 2/3
        sections:
          listed:
            extends: sections/employees
            headline: Employees
            status: listed

      - width: 1/3
        sections:
          drafts:
            extends: sections/employees
            headline: To be hired
            layout: list
            status: draft
          unlisted:
            extends: sections/employees
            headline: Inactive
            layout: list
            status: unlisted

  content:
    columns:
      - width: 1/1
        fields:
          hero:
            extends: fields/hero

          about:
            extends: fields/header

          values:
            type: structure
            fields:
              step:
                type: number
              value:
                type: text
              figure:
                type: files
                template: image
                info: "{{ file.dimensions }}"
                uploads:
                  template: image
                image:
                  ratio: 5/4
                  cover: true
              detail:
                type: writer

          teams:
            type: structure
            fields:
              name:
                type: text
              details: 
                type: writer
              figure:
                type: files
                template: image
                info: "{{ file.dimensions }}"
                uploads:
                  template: image
                image:
                  ratio: 5/4
                  cover: true
              leader:
                type: pages
                query: site.find('about')

          career:
            extends: fields/section
            label: Careers


  meta: tabs/meta/page