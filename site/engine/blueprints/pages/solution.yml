title: Solution

status:
  draft: true
  unlisted: true
  listed: true

tabs:
  content:
    columns:
      - width: 2/3
        fields:
          hero:
            extends: fields/hero

          category:
            label: Kategorie služby
            type: select
            options:
              - Celý projekt
              - Stavba a technika
              - Nábytek a vybavení

          excerpt:
            label: Krátký perex (v hrdle)
            type: writer
          intro:
            label: Úvodní text
            type: writer
          details:
            label: Hlavní text služby
            type: writer

          includesHeadline:
            label: Nadpis Co zahrnuje
            type: text
            placeholder: "Co zahrnuje"
          includes:
            label: Položky Co zahrnuje
            type: structure
            fields:
              title:
                label: Název položky
                type: text
              text:
                label: Detailnější popis (volitelný)
                type: textarea

          faqHeadline:
            label: Nadpis FAQ
            type: text
            placeholder: "Časté otázky"
          faq:
            label: Časté otázky k této službě
            type: structure
            fields:
              question:
                label: Otázka
                type: text
              answer:
                label: Odpověď
                type: textarea

          gallery:
            width: 1/1
            type: files
            template: cover
            info: "{{ file.dimensions }}"
            uploads:
              template: cover
            image:
              ratio: 5/4
              cover: true
            layout: cards
            size: large
            empty: No images yet

          relatedProjects:
            width: 1/1
            label: Ukázkové realizace k této službě
            type: pages
            layout: cards
            size: small
            query: site.find('projects')
            image:
              cover: true

      - width: 1/3
        fields:
          cover:
            width: 1/1
            type: files
            template: cover
            info: "{{ file.dimensions }}"
            uploads:
              template: cover
            image:
              ratio: 5/4
              cover: true
            max: 1
            layout: cards
            size: full

          sidebarHeadline:
            type: headline
            label: Parametry služby

          workModel:
            label: Model spolupráce
            type: text
            placeholder: "např. Design & Build nebo samostatně"

          location:
            label: Kde působíme
            type: text
            placeholder: "např. Celá Česká republika a Slovensko"

  cta: tabs/cta-subpage
  meta: tabs/meta/page
