title: Career

tabs:
  positions:
    label: Volné pozice
    columns:
      - width: 2/3
        sections:
          jobs:
            type: pages
            headline: Otevřené pozice
            parent: page.find('positions')
            status: listed
            layout: cards
            size: small
            template: job
            empty: Přidat pozici
            image:
              query: page.cover.toFile
              cover: true
              ratio: 4/5
      - width: 1/3
        sections:
          positions_page:
            type: pages
            headline: Správa sekce pozic
            parent: page
            templates:
              - positions
            layout: list
            empty: Vytvořit stránku "Volné pozice"
  content:
    columns:
      - width: 3/4
        fields:
          hero:
            extends: fields/hero

          cultureHeader:
            extends: fields/section
          culture:
            type: structure
            fields:
              label:
                type: text
              image:
                extends: fields/image
              text:
                type: writer

          coleaguesHeader:
            extends: fields/section
          coleagues:
            type: structure
            fields:
              title:
                type: text
              image:
                extends: fields/image
              text:
                type: writer

          life:
            type: structure
            fields:
              title:
                type: text
              image:
                extends: fields/cover
              text:
                type: writer

          projects:
            label: Featured Projects
            type: pages
            layout: list
            query: site.find('projects')
            image:
              cover: true

          positionsHeading:
            label: Nadpis sekce pozic
            type: text
            default: Volné pozice
          positionsSubtitle:
            label: Podtitul / instrukce sekce pozic
            type: text
            default: Vhodnou pozici nevidíte? Pošlete nám životopis na hr@u1.cz.
          positionsList:
            label: Seznam otevřených pozic
            type: structure
            fields:
              title:
                label: Název pozice
                type: text
                width: 1/2
              location:
                label: Místo / Úvazek
                type: text
                width: 1/4
                default: Brno
              url:
                label: Odkaz (nebo mailto:)
                type: text
                width: 1/4

          benefitsHeading:
            label: Nadpis benefitů (Proč pracovat u nás)
            type: text
            default: Proč pracovat u nás
          benefits:
            label: Benefity a kultura
            type: structure
            fields:
              title:
                label: Název benefitu
                type: text
              text:
                label: Popis
                type: textarea

          hiringProcessHeading:
            label: Nadpis procesu výběru
            type: text
            default: Jak probíhá výběr
          hiringProcess:
            label: Kroky výběru
            type: structure
            fields:
              step:
                label: Číslo kroku
                type: text
                width: 1/4
              title:
                label: Název kroku
                type: text
                width: 3/4
              text:
                label: Popis
                type: textarea

          ctaApplyHeading:
            label: Nadpis závěrečné výzvy
            type: text
            default: Máte o pozici zájem? Napište nám.
          ctaApplyEmail:
            label: Kontaktní e-mail
            type: email
            default: hr@u1.cz

          positions:
            extends: fields/section
            label: Positions
            # width: 1/2

          # openPositions:
          #   label: false
          #   type: pages
          #   query: site.find('career')
          #   # width: 1/2

          about:
            extends: fields/section
            label: About

          quoteHeader:
            extends: fields/section
            label: Citát

          quoteLabel:
            label: Nadtitulek / Label sekce
            type: text
            placeholder: Např. Z týmu / Citát
            width: 1/2

          quoteAuthor:
            label: Autor a pozice citátu
            type: text
            placeholder: Např. David L., provozní manažer
            width: 1/2

          quoteImage:
            extends: fields/image
            label: Fotka k citátu
            width: 1/2

          quoteText:
            label: Text citátu
            type: textarea
            width: 1/1

      - width: 1/4
        sticky: true
        fields:
          order:
            type: structure 
            fields:
              label:
                label: Choose Section Layout
                type: select
                options: query
                query:
                  fetch: page.getCurrentAndGlobalSnippets
                  text: "{{ item.text }}"
                  value: "{{ item.value }}"

  testimonials: tabs/testimonials
  cta: tabs/cta
  meta: tabs/meta/page