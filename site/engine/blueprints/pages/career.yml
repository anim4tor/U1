title: Career

tabs:
  positions:
    label: Volné pozice
    columns:
      - width: 1/1
        sections:
          positions_page:
            type: pages
            headline: Stránka volných pozic
            parent: page
            templates:
              - positions
            layout: list
            empty: Vytvořit stránku "Volné pozice"
  content:
    columns:
      - width: 3/4
        fields:
          hero:
            extends: fields/hero

          cultureHeader:
            extends: fields/section
          culture:
            type: structure
            fields:
              label:
                type: text
              image:
                extends: fields/image
              text:
                type: writer

          coleaguesHeader:
            extends: fields/section
          coleagues:
            type: structure
            fields:
              title:
                type: text
              image:
                extends: fields/image
              text:
                type: writer

          life:
            type: structure
            fields:
              title:
                type: text
              image:
                extends: fields/cover
              text:
                type: writer

          projects:
            label: Featured Projects
            type: pages
            layout: list
            query: site.find('projects')
            image:
              cover: true

          positions:
            extends: fields/section
            label: Positions
            # width: 1/2

          # openPositions:
          #   label: false
          #   type: pages
          #   query: site.find('career')
          #   # width: 1/2

          about:
            extends: fields/section
            label: About

          quoteHeader:
            extends: fields/section
            label: Oddělovač sekce Citátu

          quoteAuthor:
            label: Autor a pozice citátu
            type: text
            width: 1/2

          quoteImage:
            extends: fields/image
            label: Fotka k citátu
            width: 1/2

          quoteText:
            label: Text citátu
            type: textarea

      - width: 1/4
        sticky: true
        fields:
          order:
            type: structure 
            fields:
              label:
                label: Choose Section Layout
                type: select
                options: query
                query:
                  fetch: page.getCurrentAndGlobalSnippets
                  text: "{{ item.text }}"
                  value: "{{ item.value }}"

  meta: tabs/meta/page