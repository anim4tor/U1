title: Career 

tabs:
  jobs:
    columns:  
      - width: 2/3
        sections:
          listed:
            extends: sections/jobs
            headline: Opened positions
            status: listed

      - width: 1/3
        sections:
          drafts:
            extends: sections/jobs
            layout: list
            status: draft
          unlisted:
            extends: sections/jobs
            layout: list
            status: unlisted
  content:
    columns:
      - width: 1/1
        fields:
          hero:
            extends: fields/hero

          culture:
            type: structure
            fields:
              label:
                type: text
              image:
                extends: fields/image
              text:
                type: writer

          positions:
            extends: fields/section
            label: Opened positions
            # width: 1/2

          openPositions:
            label: false
            type: pages
            query: site.find('career')
            # width: 1/2

          about:
            extends: fields/section
            label: About


  meta: tabs/meta/page