name: 🔄 Sync Kirby Engine Across Branches

on:
  push:
    branches:
      - design
      - v1
      - v2
      - v3
      - engine
    paths:
      - 'site/engine/**'
      - 'site/config/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-kirby-engine
  cancel-in-progress: false

jobs:
  sync-engine:
    name: 🔄 Sync Engine & Blueprints
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📦 Backup current engine files
        run: |
          mkdir -p /tmp/engine_backup
          cp -r site/engine /tmp/engine_backup/
          if [ -d site/config ]; then
            mkdir -p /tmp/engine_backup/config
            cp -r site/config/* /tmp/engine_backup/config/
          fi
          echo "Engine files saved to backup directory."

      - name: 🔁 Distribute engine to target branches
        run: |
          SOURCE_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Triggered from source branch: $SOURCE_BRANCH"

          TARGET_BRANCHES=("engine" "design" "v1" "v2" "v3")

          for BRANCH in "${TARGET_BRANCHES[@]}"; do
            if [ "$BRANCH" == "$SOURCE_BRANCH" ]; then
              echo "Skipping source branch: $BRANCH"
              continue
            fi

            echo "----------------------------------------"
            echo "Processing target branch: $BRANCH"

            # Check if remote branch exists
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              git checkout -B "$BRANCH" "origin/$BRANCH"
            else
              echo "Branch $BRANCH does not exist on remote, skipping..."
              continue
            fi

            # Replace site/engine
            rm -rf site/engine
            cp -r /tmp/engine_backup/engine site/engine

            # Update site/config
            if [ -d /tmp/engine_backup/config ]; then
              mkdir -p site/config
              cp -r /tmp/engine_backup/config/* site/config/
            fi

            # Check for changes in site/engine and site/config
            if [ -n "$(git status --porcelain site/engine site/config)" ]; then
              echo "Changes detected for $BRANCH, committing and pushing..."
              git add site/engine site/config
              git commit -m "chore(engine): auto-sync kirby engine from ${SOURCE_BRANCH} [skip ci]"
              git pull --rebase origin "$BRANCH" 2>/dev/null || true
              git push origin "$BRANCH"
              echo "✅ Pushed updated engine to $BRANCH."
            else
              echo "ℹ️ No engine differences for $BRANCH, skipping."
            fi
          done
